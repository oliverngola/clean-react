language: node_js
node_js:
  - 14
addons:
  package:
    - libgconf-2-4
cache:
  npm: true
  directories:
    - ~/.cache
script:
  - eslint 'src/**'
  - npm run test:coveralls
  - npm run test:cypress:ci
deploy:
  provider: heroku
  api_key: $HEROKU_API
  app: clean-react-ongola
  skip_cleanup: true
notifications:
  email: false